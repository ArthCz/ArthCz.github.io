name: Publicar no GitHub Pages

# Roda a cada envio para a branch principal e, uma vez por dia, para reler os
# ranks, as pontuacoes e os clipes dos perfis publicos - sem ninguem precisar
# fazer nada. Tambem pode ser disparado a mao na aba Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le os perfis publicos do jogador. Se algum site estiver fora do ar, o
      # script mantem os dados anteriores, nao avanca a data exibida e o
      # trabalho segue normalmente.
      - name: Sincronizar dados publicos
        continue-on-error: true
        run: npm run sync

      - name: Gerar o site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
